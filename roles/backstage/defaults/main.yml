---
################################
# Basics
################################

backstage_name: backstage

################################
# Postgres
################################

# Backstage always requires Postgres, this only allows skipping the instance Saltbox deploys.
backstage_role_postgres_deploy: true
backstage_role_postgres_name: "{{ backstage_name }}-postgres"
# If empty it will fall back to the postgres role default.
backstage_role_postgres_user: ""
# Defaults to a persisted generated value.
backstage_role_postgres_password: "{{ backstage_saltbox_facts.facts.postgres_password }}"
backstage_role_postgres_docker_env_db: "{{ backstage_name }}"
backstage_role_postgres_docker_image_repo: "postgres"
backstage_role_postgres_docker_image_tag: "17-alpine"
backstage_role_postgres_docker_healthcheck:
  test:
    - "CMD"
    - "pg_isready"
    - "-d"
    - "{{ lookup('role_var', '_postgres_docker_env_db', role='backstage') }}"
    - "-U"
    - "{{ lookup('role_var', '_postgres_user', role='backstage', default=lookup('role_var', '_docker_env_user', role='postgres'), default_if_empty=true) }}"
  start_period: 20s
  interval: 30s
  retries: 5
  timeout: 5s
backstage_role_postgres_paths_folder: "{{ backstage_name }}/postgres"
backstage_role_postgres_paths_location: "{{ server_appdata_path }}/{{ lookup('role_var', '_postgres_paths_folder', role='backstage') }}"

################################
# Paths
################################

backstage_role_paths_folder: "{{ backstage_name }}"
backstage_role_paths_location: "{{ server_appdata_path }}/{{ backstage_role_paths_folder }}"
backstage_role_paths_folders_list:
  - "{{ backstage_role_paths_location }}"

################################
# Web
################################

backstage_role_web_subdomain: "{{ backstage_name }}"
backstage_role_web_domain: "{{ user.domain }}"
backstage_role_web_port: "7007"
backstage_role_web_url: "{{ lookup('role_web', role='backstage', scheme='https') }}"

################################
# DNS
################################

backstage_role_dns_record: "{{ lookup('role_var', '_web_subdomain', role='backstage') }}"
backstage_role_dns_zone: "{{ lookup('role_var', '_web_domain', role='backstage') }}"
backstage_role_dns_proxy: "{{ dns_proxied }}"

################################
# Traefik
################################

# The stock Backstage image only ships the guest auth provider, which provides
# no real security. Authelia protects it until a real auth provider is configured.
# Set to "" once one is.
backstage_role_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
backstage_role_traefik_middleware_default: "{{ traefik_default_middleware }}"
backstage_role_traefik_middleware_custom: ""
backstage_role_traefik_middleware_default_api: "{{ traefik_default_middleware_api }}"
backstage_role_traefik_middleware_custom_api: ""
backstage_role_traefik_certresolver: "{{ traefik_default_certresolver }}"
backstage_role_traefik_enabled: true
backstage_role_traefik_api_enabled: false
backstage_role_traefik_api_endpoint: ""

################################
# Docker
################################

# Container
backstage_role_docker_container: "{{ backstage_name }}"

# Image
# Built and published by GitHub Actions from https://github.com/Mathod95/backstage
# Pin a tag or a commit sha for reproducible deployments.
backstage_role_docker_image_pull: true
backstage_role_docker_image_repo: "ghcr.io/mathod95/backstage"
backstage_role_docker_image_tag: "latest"
backstage_role_docker_image: "{{ lookup('role_var', '_docker_image_repo', role='backstage') }}:{{ lookup('role_var', '_docker_image_tag', role='backstage') }}"

# Envs
backstage_role_docker_envs_default:
  TZ: "{{ tz }}"
  POSTGRES_HOST: "{{ lookup('role_var', '_postgres_name', role='backstage') }}"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "{{ lookup('role_var', '_postgres_user', role='backstage', default=lookup('role_var', '_docker_env_user', role='postgres'), default_if_empty=true) }}"
  POSTGRES_PASSWORD: "{{ lookup('role_var', '_postgres_password', role='backstage', default=lookup('role_var', '_docker_env_password', role='postgres'), default_if_empty=true) }}"
backstage_role_docker_envs_custom: {}
backstage_role_docker_envs: "{{ lookup('role_var', '_docker_envs_default', role='backstage')
                                | combine(lookup('role_var', '_docker_envs_custom', role='backstage')) }}"

# Hostname
backstage_role_docker_hostname: "{{ backstage_name }}"

# Networks
backstage_role_docker_networks_alias: "{{ backstage_name }}"
backstage_role_docker_networks_default: []
backstage_role_docker_networks_custom: []
backstage_role_docker_networks: "{{ docker_networks_common
                                    + lookup('role_var', '_docker_networks_default', role='backstage')
                                    + lookup('role_var', '_docker_networks_custom', role='backstage') }}"

# Restart Policy
backstage_role_docker_restart_policy: unless-stopped

################################
# Dependencies
################################

backstage_role_depends_on: "{{ lookup('role_var', '_postgres_name', role='backstage') if lookup('role_var', '_postgres_deploy', role='backstage') else '' }}"
backstage_role_depends_on_delay: "0"
backstage_role_depends_on_healthchecks: "false"
